    <rect x="1322" y="218" width="20" height="20" rx="2" class="s2" fill="url(#fadeRight)"/>
    <rect x="1362" y="226" width="16" height="12" rx="2" class="s2" fill="url(#fadeRight)"/>
    <rect x="1400" y="212" width="18" height="26" rx="2" class="s2" fill="url(#fadeRight)"/>
    <rect x="1442" y="222" width="14" height="16" rx="2" class="s2" fill="url(#fadeRight)"/>
  </g>

  <!-- robotic arm -->
  <g class="soft">
    <circle cx="1450" cy="118" r="18" class="s2" fill="url(#fadeRight)"/>
    <circle cx="1410" cy="154" r="14" class="s2" fill="url(#fadeRight)"/>
    <circle cx="1358" cy="191" r="13" class="s2" fill="url(#fadeRight)"/>
    <line x1="1438" y1="130" x2="1419" y2="144" class="s1"/>
    <line x1="1398" y1="163" x2="1369" y2="182" class="s1"/>
    <line x1="1450" y1="136" x2="1450" y2="172" class="s1"/>
    <line x1="1450" y1="172" x2="1418" y2="172" class="s1"/>
    <line x1="1360" y1="204" x2="1360" y2="222" class="s1"/>
    <line x1="1360" y1="222" x2="1410" y2="222" class="s1"/>
    <line x1="1410" y1="222" x2="1410" y2="238" class="s1"/>
    <path d="M1346 196 L1328 208" class="s2"/>
    <path d="M1328 208 L1318 202" class="s2"/>
    <path d="M1328 208 L1318 216" class="s2"/>
  </g>

  <!-- right skyline -->
  <g class="soft">
    <rect x="1242" y="228" width="20" height="42" class="s2" fill="url(#fadeRight)"/>
    <rect x="1268" y="210" width="26" height="60" class="s2" fill="url(#fadeRight)"/>
    <rect x="1500" y="220" width="22" height="50" class="s2" fill="url(#fadeRight)"/>
    <rect x="1528" y="204" width="28" height="66" class="s2" fill="url(#fadeRight)"/>
  </g>

  <!-- tower / node pillars -->
  <g class="softer">
    <line x1="1328" y1="176" x2="1328" y2="270" class="s2"/>
    <line x1="1392" y1="176" x2="1392" y2="270" class="s2"/>
    <circle cx="1328" cy="176" r="6" class="s2" fill="url(#fadeRight)"/>
    <circle cx="1392" cy="176" r="6" class="s2" fill="url(#fadeRight)"/>
    <line x1="1328" y1="210" x2="1392" y2="210" class="s3"/>
  </g>

  <!-- right fade to center -->
  <g class="softest">
    <line x1="1180" y1="248" x2="1240" y2="248" class="s3 dash"/>
    <line x1="1174" y1="214" x2="1242" y2="214" class="s3 dash"/>
    <line x1="1184" y1="184" x2="1246" y2="184" class="s3 dash"/>
  </g>
</svg>