<svg width="1600" height="360" viewBox="0 0 1600 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="fadeRight" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.04"/>
    </linearGradient>
    <style>
      .s1 { stroke:#2563EB; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .s2 { stroke:#2563EB; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
      .s3 { stroke:#2563EB; stroke-width:1; stroke-linecap:round; stroke-linejoin:round; }
      .f1 { fill:#2563EB; }
      .soft { opacity:0.14; }
      .softer { opacity:0.10; }
      .softest { opacity:0.07; }
      .dash { stroke-dasharray:5 6; }
    </style>
  </defs>

  <!-- transparent background -->
  <rect x="0" y="0" width="1600" height="360" fill="transparent"/>

  <!-- center keep-empty mask feeling -->
  <rect x="420" y="20" width="760" height="300" fill="white" fill-opacity="0"/>

  <!-- ground line -->
  <line x1="0" y1="270" x2="1600" y2="270" class="s3 softest"/>

  <!-- ================= LEFT SIDE ================= -->
  <g class="soft">
    <!-- left skyline -->
    <rect x="18" y="210" width="24" height="60" class="s2" fill="url(#fadeLeft)"/>
    <rect x="48" y="230" width="20" height="40" class="s2" fill="url(#fadeLeft)"/>
    <rect x="76" y="196" width="28" height="74" class="s2" fill="url(#fadeLeft)"/>
    <rect x="110" y="220" width="22" height="50" class="s2" fill="url(#fadeLeft)"/>
    <rect x="140" y="188" width="30" height="82" class="s2" fill="url(#fadeLeft)"/>
    <rect x="176" y="214" width="24" height="56" class="s2" fill="url(#fadeLeft)"/>
  </g>

  <g class="soft">
    <!-- tower / landmark -->
    <line x1="118" y1="155" x2="118" y2="270" class="s2"/>
    <line x1="102" y1="173" x2="134" y2="173" class="s2"/>
    <line x1="106" y1="193" x2="130" y2="193" class="s3"/>
    <polygon points="118,138 112,155 124,155" class="s2" fill="url(#fadeLeft)"/>
  </g>

  <!-- wind turbine -->
  <g class="soft">
    <line x1="72" y1="92" x2="72" y2="270" class="s2"/>
    <circle cx="72" cy="92" r="5" class="s2" fill="url(#fadeLeft)"/>
    <path d="M72 92 L48 58 Q64 54 74 70 Z" class="s2" fill="url(#fadeLeft)"/>
    <path d="M72 92 L102 86 Q94 102 78 104 Z" class="s2" fill="url(#fadeLeft)"/>
    <path d="M72 92 L64 122 Q54 108 60 92 Z" class="s2" fill="url(#fadeLeft)"/>
  </g>

  <!-- drone -->
  <g class="softer">
    <rect x="210" y="72" width="34" height="10" rx="4" class="s2" fill="url(#fadeLeft)"/>
    <line x1="196" y1="77" x2="210" y2="77" class="s2"/>
    <line x1="244" y1="77" x2="258" y2="77" class="s2"/>
    <line x1="206" y1="69" x2="196" y2="58" class="s2"/>
    <line x1="248" y1="69" x2="258" y2="58" class="s2"/>
    <line x1="206" y1="85" x2="196" y2="96" class="s2"/>
    <line x1="248" y1="85" x2="258" y2="96" class="s2"/>
    <circle cx="193" cy="56" r="7" class="s2"/>
    <circle cx="261" cy="56" r="7" class="s2"/>
    <circle cx="193" cy="98" r="7" class="s2"/>
    <circle cx="261" cy="98" r="7" class="s2"/>
    <line x1="227" y1="82" x2="227" y2="112" class="s2"/>
    <line x1="217" y1="112" x2="237" y2="112" class="s2"/>
  </g>

  <!-- smart car -->
  <g class="soft">
    <path d="M210 223 L236 200 Q246 191 266 191 L314 191 Q329 191 337 204 L349 223 Q354 229 354 238 L354 247 L349 247 Q347 259 334 259 L229 259 Q216 259 214 247 L206 247 L206 238 Q206 229 210 223 Z"
      class="s2" fill="url(#fadeLeft)"/>
    <circle cx="238" cy="247" r="12" class="s2"/>
    <circle cx="325" cy="247" r="12" class="s2"/>
    <line x1="250" y1="204" x2="323" y2="204" class="s2"/>
    <line x1="243" y1="204" x2="231" y2="223" class="s2"/>
    <line x1="325" y1="204" x2="337" y2="223" class="s2"/>
  </g>

  <!-- network lines on left -->
