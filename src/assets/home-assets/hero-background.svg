    <circle cx="20" cy="120" r="3" class="f1"/>
    <circle cx="118" cy="84" r="3" class="f1"/>
    <circle cx="180" cy="130" r="3" class="f1"/>
    <circle cx="224" cy="98" r="3" class="f1"/>
    <circle cx="310" cy="142" r="3" class="f1"/>
    <circle cx="362" cy="96" r="3" class="f1"/>
    <line x1="20" y1="120" x2="118" y2="84" class="s3 dash"/>
    <line x1="118" y1="84" x2="180" y2="130" class="s3 dash"/>
    <line x1="180" y1="130" x2="224" y2="98" class="s3 dash"/>
    <line x1="224" y1="98" x2="310" y2="142" class="s3 dash"/>
    <line x1="310" y1="142" x2="362" y2="96" class="s3 dash"/>
    <line x1="224" y1="98" x2="227" y2="72" class="s3 dash"/>
    <line x1="310" y1="142" x2="286" y2="191" class="s3 dash"/>
  </g>

  <!-- fade out toward center -->
  <g class="softest">
    <line x1="360" y1="248" x2="430" y2="248" class="s3 dash"/>
    <line x1="348" y1="220" x2="426" y2="220" class="s3 dash"/>
    <line x1="340" y1="188" x2="420" y2="188" class="s3 dash"/>
  </g>

  <!-- ================= RIGHT SIDE ================= -->
  <!-- right network -->
  <g class="softest">
    <circle cx="1220" cy="92" r="3.5" class="f1"/>
    <circle cx="1284" cy="68" r="3.5" class="f1"/>
    <circle cx="1328" cy="110" r="3.5" class="f1"/>
    <circle cx="1392" cy="84" r="3.5" class="f1"/>
    <circle cx="1460" cy="120" r="3.5" class="f1"/>
    <circle cx="1502" cy="78" r="3.5" class="f1"/>
    <line x1="1220" y1="92" x2="1284" y2="68" class="s3 dash"/>
    <line x1="1284" y1="68" x2="1328" y2="110" class="s3 dash"/>
    <line x1="1328" y1="110" x2="1392" y2="84" class="s3 dash"/>
    <line x1="1392" y1="84" x2="1460" y2="120" class="s3 dash"/>
    <line x1="1460" y1="120" x2="1502" y2="78" class="s3 dash"/>
    <line x1="1328" y1="110" x2="1328" y2="175" class="s3 dash"/>
    <line x1="1392" y1="84" x2="1392" y2="175" class="s3 dash"/>
